<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin | Phan Thuần Xtra</title><link rel="stylesheet" href="/style.css"><style>.admin{padding:40px 0}.admin-grid{display:grid;grid-template-columns:320px 1fr;gap:24px}.panel{background:#fff;border:1px solid var(--line);padding:24px}.panel h2{margin-top:0}.field{display:grid;gap:6px;margin-bottom:14px}.field label{font-size:12px;font-weight:800}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);padding:11px;background:#fff}.field textarea{min-height:110px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.inventory{display:grid;gap:10px}.item{border:1px solid var(--line);padding:14px;display:flex;justify-content:space-between;gap:15px;align-items:center}.item small{color:#777}.danger{border-color:#a33;color:#a33;background:#fff}.status{margin:0 0 15px;padding:10px;background:#f5f4f1}.hidden{display:none!important}@media(max-width:800px){.admin-grid{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}</style></head><body><header class="header"><div class="container nav"><a class="logo" href="/">PHAN THUẦN <span>XTRA</span></a><a class="hotline" href="/">← Website</a></div></header><main class="admin"><div class="container"><div id="login" class="panel"><p class="eyebrow">PRIVATE ADMIN</p><h1>Đăng nhập quản trị</h1><p>Token quản trị được lưu trong phiên trình duyệt, không hiển thị trên URL.</p><div class="field"><label>ADMIN TOKEN</label><input id="token" type="password" autocomplete="current-password" placeholder="Nhập ADMIN_TOKEN"></div><button id="loginBtn" class="btn primary">Đăng nhập</button><p id="loginMsg" class="notice hidden"></p></div><div id="app" class="hidden"><div class="section-head"><div><p class="eyebrow">INVENTORY MANAGEMENT</p><h1>Quản lý kho xe</h1></div><button id="logout" class="btn">Đăng xuất</button></div><div class="admin-grid"><section class="panel"><h2 id="formTitle">Đăng bài xe mới</h2><p id="status" class="status">Sẵn sàng.</p><form id="carForm"><div class="field"><label>ID bài đăng *</label><input id="id" required pattern="[A-Za-z0-9_-]{3,81}" placeholder="vd: lx600-urban"></div><div class="grid2"><div class="field"><label>Hãng *</label><input id="brand" required placeholder="Lexus"></div><div class="field"><label>Tên mẫu xe *</label><input id="model" required placeholder="Lexus LX600 Urban"></div></div><div class="grid2"><div class="field"><label>Năm</label><input id="year" type="number" min="1900" max="2100"></div><div class="field"><label>Số km</label><input id="mileage" type="number" min="0"></div></div><div class="grid2"><div class="field"><label>Giá (VNĐ)</label><input id="price" type="number" min="0"></div><div class="field"><label>Nhiên liệu / động cơ</label><input id="fuel" placeholder="V6 3.4 Twin Turbo"></div></div><div class="grid2"><div class="field"><label>Phân khúc</label><select id="category"><option value="suv">SUV</option><option value="sport">Sport</option><option value="sedan">Sedan</option><option value="other">Khác</option></select></div><div class="field"><label>Màu xe</label><input id="color"></div></div><div class="field"><label>Trạng thái</label><select id="statusSelect"><option value="available">Đang bán</option><option value="sold">Đã bán</option><option value="reserved">Đặt cọc</option><option value="hidden">Ẩn</option></select></div><div class="field"><label>Mô tả</label><textarea id="description" placeholder="Mô tả xe, lịch sử, trang bị..."></textarea></div><div class="field"><label>Ảnh xe (mỗi URL một dòng)</label><textarea id="images" placeholder="https://.../lx600.jpg"></textarea></div><div class="field"><label>Trang bị (mỗi dòng một mục)</label><textarea id="features" placeholder="Mark Levinson&#10;Lexus Safety System+&#10;Camera 360"></textarea></div><div class="actions"><button class="btn primary" type="submit">Lưu bài đăng</button><button id="newBtn" class="btn" type="button">Tạo mới</button></div></form></section><section class="panel"><h2>Kho xe</h2><div id="inventory" class="inventory">Đang tải...</div></section></div></div></div></main><script>const $=s=>document.querySelector(s);let token=sessionStorage.getItem('ptx_admin_token')||'',editing=null;const fields=['id','brand','model','year','mileage','price','fuel','color','description'];function setMsg(t,ok=false){const x=$('#status');x.textContent=t;x.style.background=ok?'#e8f4e8':'#f5f4f1'}function api(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};return fetch(path,opt).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Lỗi máy chủ');return d})}function showApp(){if(!token)return;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');load()}async function load(){try{const d=await api('/api/admin/cars');$('#inventory').innerHTML=d.cars.length?d.cars.map(c=>`<div class="item"><div><b>${esc(c.brand)} ${esc(c.model)}</b><br><small>${esc(c.year||'')} • ${Number(c.mileage||0).toLocaleString('vi-VN')} km • ${esc(c.status)}</small></div><div><button class="btn small" onclick="editCar('${esc(c.id)}')">Sửa</button> <button class="btn small danger" onclick="deleteCar('${esc(c.id)}')">Xóa</button></div></div>`).join(''):'<p class="notice">Chưa có bài đăng trong D1.</p>'}catch(e){setMsg(e.message)}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function reset(){editing=null;$('#formTitle').textContent='Đăng bài xe mới';$('#carForm').reset();$('#statusSelect').value='available'}function fill(c){editing=c.id;$('#formTitle').textContent='Chỉnh sửa bài đăng';for(const k of fields)if($( '#'+k))$('#'+k).value=c[k]??'';$('#statusSelect').value=c.status||'available';$('#category').value=c.category||'suv';$('#images').value=(JSON.parse(c.images_json||'[]')||[]).join('\n');$('#features').value=(JSON.parse(c.features_json||'[]')||[]).join('\n');window.scrollTo({top:0,behavior:'smooth'})}window.editCar=async id=>{try{const d=await api('/api/admin/cars');const c=d.cars.find(x=>x.id===id);if(c)fill(c)}catch(e){setMsg(e.message)}};window.deleteCar=async id=>{if(!confirm('Xóa bài đăng '+id+'?'))return;try{await api('/api/admin/cars',{method:'DELETE',body:JSON.stringify({id})});setMsg('Đã xóa bài đăng.',true);if(editing===id)reset();load()}catch(e){setMsg(e.message)}};$('#loginBtn').onclick=()=>{token=$('#token').value.trim();if(!token)return;sessionStorage.setItem('ptx_admin_token',token);showApp()};$('#logout').onclick=()=>{sessionStorage.removeItem('ptx_admin_token');token='';location.reload()};$('#newBtn').onclick=reset;$('#carForm').onsubmit=async e=>{e.preventDefault();const b={id:$('#id').value.trim(),brand:$('#brand').value.trim(),model:$('#model').value.trim(),year:$('#year').value,mileage:$('#mileage').value,price:$('#price').value,fuel:$('#fuel').value,category:$('#category').value,color:$('#color').value,status:$('#statusSelect').value,description:$('#description').value,images:$('#images').value.split(/\n+/).map(x=>x.trim()).filter(Boolean),features:$('#features').value.split(/\n+/).map(x=>x.trim()).filter(Boolean)};try{await api('/api/admin/cars',{method:editing?'PUT':'POST',body:JSON.stringify(b)});setMsg(editing?'Đã cập nhật bài đăng.':'Đã đăng xe thành công.',true);load();reset()}catch(e){setMsg(e.message)}};if(token)showApp();</script></body></html>
