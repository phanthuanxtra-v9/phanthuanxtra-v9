<div id="login">

<h1>Đăng nhập quản trị</h1>

<p class="notice">
Mật khẩu quản trị được xác thực an toàn.
Phiên đăng nhập được lưu trong session trình duyệt.
</p>

<label for="password">
ADMIN PASSWORD
</label>

<input
  id="password"
  type="password"
  autocomplete="current-password"
  placeholder="Nhập mật khẩu quản trị"
/>

<button id="loginBtn" type="button">
Đăng nhập
</button>

<div id="loginMsg" class="statusline"></div>

</div>


<div id="app" class="hidden">

<button id="logout" type="button">
Đăng xuất
</button>

</div>


<script>

let token = sessionStorage.getItem('ptx_admin_token') || '';

let password = '';
let cars = [];
let leads = [];
let editing = null;
let photos = [];


function msg(id,text,ok=false){

 const el=document.querySelector(id);

 if(!el)return;

 el.textContent=text;

 el.className='statusline '+(ok?'ok':'err');

}


async function login(){

 const input=document.querySelector('#password');

 if(!input){

   console.error('Không tìm thấy ô password');

   return;

 }


 const password=input.value.trim();


 if(!password){

   msg('#loginMsg','Vui lòng nhập mật khẩu');

   return;

 }


 try{


 const res=await fetch('/api/admin/login',{

   method:'POST',

   headers:{
    'Content-Type':'application/json'
   },

   body:JSON.stringify({
    password
   })

 });


 const data=await res.json();


 if(!res.ok || !data.ok){

   msg(
    '#loginMsg',
    data.error || 'Sai mật khẩu'
   );

   return;

 }


 sessionStorage.setItem(
  'ptx_admin_token',
  data.token
 );


 token=data.token;


 location.href='/admin.html?v='+Date.now();


 }catch(err){

   msg(
    '#loginMsg',
    'Lỗi kết nối máy chủ'
   );

   console.error(err);

 }

}



function logout(){

 sessionStorage.removeItem(
  'ptx_admin_token'
 );

 location.reload();

}



document.addEventListener(
'DOMContentLoaded',
()=>{


 const btn=document.querySelector('#loginBtn');

 if(btn){

   btn.onclick=login;

 }



 const pass=document.querySelector('#password');

 if(pass){

   pass.addEventListener(
    'keydown',
    e=>{
      if(e.key==='Enter'){
        login();
      }
    }
   );

 }



 const logoutBtn=document.querySelector('#logout');

 if(logoutBtn){

   logoutBtn.onclick=logout;

 }


});

</script>
