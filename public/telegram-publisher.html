<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Telegram Publisher | Phan Thuần Xtra</title><link rel="stylesheet" href="/style.css"><style>body{background:#f3f2ef}.wrap{max-width:980px;margin:40px auto;padding:0 18px}.panel{background:#fff;border:1px solid #ddd;padding:24px;margin-bottom:18px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.car{border:1px solid #ddd;padding:14px;margin:8px 0;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.meta{font-size:12px;color:#666}.status{padding:12px;background:#f5f4f1}.ok{background:#e8f3e8}.err{background:#f8e7e7}button{cursor:pointer}.danger{font-size:12px}.hidden{display:none!important}@media(max-width:650px){.car{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="panel"><p class="eyebrow">TELEGRAM AUTO POST</p><h1>Đăng xe lên Telegram</h1><p class="meta">Dùng ADMIN_TOKEN của CMS. Token chỉ lưu trong session của trình duyệt.</p><div class="row"><input id="token" type="password" autocomplete="current-password" placeholder="ADMIN_TOKEN"><button class="btn primary" id="login">Kết nối</button></div><p id="status" class="status">Chưa kết nối.</p></section><section id="app" class="panel hidden"><div class="row"><input id="search" placeholder="Tìm hãng, mẫu xe, ID..."><button class="btn" id="refresh">↻ Làm mới</button></div><div id="cars"></div></section></main><script>const $=s=>document.querySelector(s);let token=sessionStorage.getItem('ptx_admin_token')||'';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token};if(opt.body)opt.headers['Content-Type']='application/json';const r=await fetch(path,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Lỗi máy chủ');return d}async function load(){try{const d=await api('/api/admin/cars');window.cars=d.cars||[];render();$('#app').classList.remove('hidden');$('#status').textContent=`Đã tải ${window.cars.length} xe.`;$('#status').className='status ok'}catch(e){$('#status').textContent=e.message;$('#status').className='status err'}}function render(){const q=$('#search').value.trim().toLowerCase();const list=(window.cars||[]).filter(c=>!q||[c.id,c.brand,c.model].join(' ').toLowerCase().includes(q));$('#cars').innerHTML=list.length?list.map(c=>`<div class="car"><div><b>${esc(c.brand)} ${esc(c.model)}</b><div class="meta">ID: ${esc(c.id)} • Trạng thái: ${esc(c.status||'available')} • Ảnh: ${Array.isArray(c.images)?c.images.length:0}</div></div><button class="btn primary" data-id="${esc(c.id)}">Đăng Telegram</button></div>`).join(''):'<p>Không có xe phù hợp.</p>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>publish(b.dataset.id,b))}async function publish(id,button){if(!confirm(`Đăng ${id} lên Telegram?`))return;button.disabled=true;button.textContent='Đang đăng...';try{const d=await api('/api/admin/telegram/publish',{method:'POST',body:JSON.stringify({car_id:id})});if(d.duplicate){$('#status').textContent='Xe này đã được đăng Telegram — chặn đăng trùng.';$('#status').className='status ok'}else{$('#status').textContent=`Đăng thành công: ${d.message_ids?.length||0} message, ${d.images||0} ảnh.`;$('#status').className='status ok'}}catch(e){$('#status').textContent=e.message;$('#status').className='status err'}finally{button.disabled=false;button.textContent='Đăng Telegram'}}$('#login').onclick=()=>{token=$('#token').value.trim();if(!token)return;sessionStorage.setItem('ptx_admin_token',token);load()};$('#refresh').onclick=load;$('#search').oninput=render;if(token){$('#token').value='••••••••';load()}</script></body></html>
