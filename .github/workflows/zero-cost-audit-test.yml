name: Zero-Cost Audit Test

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: 'Optional audit/test instruction'
        required: false
        default: 'Validate repository structure and run safe repository checks. Do not modify files or production infrastructure.'
        type: string
      mode:
        description: 'Zero-cost execution mode'
        required: true
        type: choice
        options:
          - audit
          - test
      task_id:
        description: 'Gateway task ID'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  zero-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate dispatch inputs
        shell: bash
        env:
          TASK_ID: ${{ inputs.task_id }}
          INSTRUCTION: ${{ inputs.instruction }}
          MODE: ${{ inputs.mode }}
        run: |
          set -u
          echo '## Dispatch validation'
          echo "mode=${MODE:-<empty>}"
          echo "task_id_length=${#TASK_ID}"
          echo "task_id=$TASK_ID"
          echo "instruction_length=${#INSTRUCTION}"
          echo 'openai_api_calls=0'

          if [[ ! "$TASK_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo 'ERROR: task_id is not a canonical UUID.'
            exit 1
          fi
          if [[ -z "$INSTRUCTION" ]]; then
            echo 'ERROR: instruction is empty.'
            exit 1
          fi
          if [[ "$MODE" != 'audit' && "$MODE" != 'test' ]]; then
            echo "ERROR: unsupported mode: $MODE"
            exit 1
          fi
          echo 'dispatch_inputs=valid'

      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Zero-cost repository audit
        if: ${{ inputs.mode == 'audit' }}
        shell: bash
        env:
          INSTRUCTION: ${{ inputs.instruction }}
        run: |
          set -euo pipefail
          {
            echo '# Zero-Cost Repository Audit'
            echo
            echo '- OpenAI API calls: **0**'
            echo '- Production deploy/rollback: **not attempted**'
            echo
            echo '## Repository'
            git remote -v | sed -E 's#https?://[^[:space:]]+#(redacted-remote-url)#g'
            git branch --show-current
            git rev-parse HEAD
            echo
            echo '## Top-level structure'
            find . -maxdepth 2 -type f -not -path './.git/*' | sort | head -n 250
            echo
            echo '## Cloudflare configuration'
            if [ -f wrangler.json ]; then
              node -e "JSON.parse(require('fs').readFileSync('wrangler.json','utf8')); console.log('wrangler.json: valid JSON')"
            else
              echo 'wrangler.json: missing'
            fi
            echo
            echo '## GitHub workflows'
            find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) 2>/dev/null | sort || true
            echo
            echo '## Package configuration'
            node -e "const p=require('./package.json'); console.log(JSON.stringify({name:p.name,version:p.version,scripts:Object.keys(p.scripts||{}),engines:p.engines},null,2))"
            echo
            echo '## Gateway configuration checks'
            grep -nE "GATEWAY_READ_TOKEN|GITHUB_ACTIONS_DISPATCH_TOKEN|PRODUCTION_MUTATIONS_ENABLED|production_mutation_disabled|MODES" developer-gateway/src/index.js || true
            echo
            echo '## Working-tree status'
            if [ -z "$(git status --porcelain)" ]; then
              echo 'clean'
            else
              git status --short
            fi
            echo
            echo '## User instruction'
            printf '%s\n' "$INSTRUCTION"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Zero-cost repository test
        if: ${{ inputs.mode == 'test' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Zero-Cost Repository Test'
            echo '- OpenAI API calls: **0**'
            echo '- Production deploy/rollback: **not attempted**'
            echo
            echo '### package.json'
            node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('valid JSON')"
            echo '### wrangler.json'
            node -e "JSON.parse(require('fs').readFileSync('wrangler.json','utf8')); console.log('valid JSON')"
            echo '### Developer Gateway unit tests'
            node --test developer-gateway/test/index.test.mjs
            echo '### Dependency installation and repository check'
            npm ci --ignore-scripts
            npm run check
            echo
            echo '### Final working-tree status'
            if [ -z "$(git status --porcelain)" ]; then
              echo 'clean'
            else
              git status --short
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish zero-cost result
        shell: bash
        run: |
          set -euo pipefail
          echo >> "$GITHUB_STEP_SUMMARY"
          echo 'ZERO_COST_OPENAI_CALLS=0' >> "$GITHUB_STEP_SUMMARY"
