name: QUEUE-01 Production E2E Origin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      BASE_URL: https://phanthuanxtra-v2.phanthuanmodelactor.workers.dev
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      CF_PRIMARY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_BACKUP_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
      - name: Admin 200 + signed session + dashboard + D1 CRUD + R2 write/read/delete
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ADMIN_PASSWORD"
          test -n "$CF_ACCOUNT_ID"
          TEST_CAR_ID="ci-origin-e2e-${GITHUB_RUN_ID}"
          R2_KEY="admin/e2e-${GITHUB_RUN_ID}.png"
          export TEST_CAR_ID R2_KEY
          status="$(curl --silent --show-error --retry 2 --max-time 20 -o /tmp/login.json -w '%{http_code}' \
            -X POST "$BASE_URL/api/admin/login" -H 'content-type: application/json' \
            --data "$(jq -nc --arg password "$ADMIN_PASSWORD" '{password:$password}')")"
          echo "Worker-origin Admin login HTTP $status"
          test "$status" = "200"
          SESSION="$(jq -r '.token // empty' /tmp/login.json)"
          test "$SESSION" != ""
          printf '%s' "$SESSION" | grep -Eq '^ptx1\.[0-9]+\.[a-f0-9]{32}\.[A-Za-z0-9_-]+$'
          echo 'Admin signed session: ptx1 HMAC token shape verified'
          cleanup() {
            curl --silent --show-error --retry 2 --max-time 20 -X DELETE "$BASE_URL/api/admin/cars/$TEST_CAR_ID" \
              -H "Authorization: Bearer $SESSION" >/dev/null || true
            if [ -n "${R2_TOKEN:-}" ]; then
              curl --silent --show-error --retry 2 --max-time 20 -X DELETE \
                "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/r2/buckets/phanthuanxtra-media/objects/$R2_KEY" \
                -H "Authorization: Bearer $R2_TOKEN" >/dev/null || true
            fi
          }
          trap cleanup EXIT
          curl --fail-with-body --silent --show-error --retry 2 --max-time 20 \
            -H "Authorization: Bearer $SESSION" "$BASE_URL/api/admin/dashboard" | tee /tmp/dashboard.json
          jq -e '.stats and (.stats.cars|type == "number")' /tmp/dashboard.json >/dev/null
          echo 'Authenticated dashboard: OK'
          # The Admin vehicle pipeline requires trusted production media URLs and otherwise fetches with redirect:error.
          # Use a deterministic trusted-path placeholder for the D1 CRUD contract; R2 is exercised directly below.
          TEST_IMAGE_URL="https://phanthuanxtra.com/media/vehicles/publish-admin-${TEST_CAR_ID}.jpg"
          export TEST_IMAGE_URL
          curl --fail-with-body --silent --show-error --retry 2 --max-time 20 \
            -X POST "$BASE_URL/api/admin/cars" -H "Authorization: Bearer $SESSION" -H 'content-type: application/json' \
            --data "{\"id\":\"$TEST_CAR_ID\",\"brand\":\"PT XTRA TEST\",\"model\":\"CI E2E Origin\",\"year\":2026,\"mileage\":1,\"price\":1,\"fuel\":\"test\",\"category\":\"suv\",\"color\":\"test\",\"status\":\"available\",\"description\":\"Queue-01 production E2E; automatically deleted.\",\"features\":[\"e2e\"],\"images\":[\"$TEST_IMAGE_URL\"]}" | tee /tmp/create.json
          jq -e '.ok == true and .id == env.TEST_CAR_ID' /tmp/create.json >/dev/null
          curl --fail-with-body --silent --show-error --retry 2 --max-time 20 \
            -H "Authorization: Bearer $SESSION" "$BASE_URL/api/admin/cars/$TEST_CAR_ID" | tee /tmp/read-one.json
          jq -e --arg id "$TEST_CAR_ID" '.car.id == $id and .car.brand == "PT XTRA TEST"' /tmp/read-one.json >/dev/null
          echo 'D1 CRUD create/read: OK'
          curl --fail-with-body --silent --show-error --retry 2 --max-time 20 \
            -X DELETE "$BASE_URL/api/admin/cars/$TEST_CAR_ID" -H "Authorization: Bearer $SESSION" | tee /tmp/delete.json
          jq -e '.ok == true and .deleted == env.TEST_CAR_ID' /tmp/delete.json >/dev/null
          status="$(curl --silent --show-error --retry 2 --max-time 20 -o /tmp/read-after-delete.json -w '%{http_code}' \
            -H "Authorization: Bearer $SESSION" "$BASE_URL/api/admin/cars/$TEST_CAR_ID")"
          echo "D1 read after delete HTTP $status"
          test "$status" = "404"
          echo 'D1 CRUD delete: OK'
          printf 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 -d > /tmp/xtra-e2e.png

          select_r2_token() {
            if [ -n "${CF_PRIMARY_TOKEN:-}" ]; then
              status="$(curl --silent --show-error --retry 2 --max-time 20 -o /tmp/r2-primary.json -w '%{http_code}' \
                -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/r2/buckets/phanthuanxtra-media/objects/$R2_KEY" \
                -H "Authorization: Bearer $CF_PRIMARY_TOKEN" -H 'content-type: image/png' --data-binary @/tmp/xtra-e2e.png)"
              if [ "$status" = "200" ]; then
                R2_TOKEN="$CF_PRIMARY_TOKEN"
                export R2_TOKEN
                echo 'R2 write: primary Cloudflare token accepted'
                return 0
              fi
              echo "Primary R2 write HTTP $status; testing backup token."
            fi
            if [ -n "${CF_BACKUP_TOKEN:-}" ]; then
              status="$(curl --silent --show-error --retry 2 --max-time 20 -o /tmp/r2-backup.json -w '%{http_code}' \
                -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/r2/buckets/phanthuanxtra-media/objects/$R2_KEY" \
                -H "Authorization: Bearer $CF_BACKUP_TOKEN" -H 'content-type: image/png' --data-binary @/tmp/xtra-e2e.png)"
              if [ "$status" = "200" ]; then
                R2_TOKEN="$CF_BACKUP_TOKEN"
                export R2_TOKEN
                echo 'R2 write: backup Cloudflare token accepted'
                return 0
              fi
              echo "Backup R2 write HTTP $status"
            fi
            return 1
          }

          select_r2_token
          test -n "${R2_TOKEN:-}"
          curl --fail-with-body --silent --show-error --retry 2 --max-time 20 \
            -H "Authorization: Bearer $R2_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/r2/buckets/phanthuanxtra-media/objects/$R2_KEY" \
            -o /tmp/read.png
          cmp /tmp/xtra-e2e.png /tmp/read.png
          echo 'R2 write/read: OK'
          status="$(curl --silent --show-error --retry 2 --max-time 20 -o /tmp/r2-delete.json -w '%{http_code}' \
            -X DELETE "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/r2/buckets/phanthuanxtra-media/objects/$R2_KEY" \
            -H "Authorization: Bearer $R2_TOKEN")"
          echo "R2 delete HTTP $status"
          test "$status" = "200"
          status="$(curl --silent --show-error --retry 2 --max-time 20 -o /tmp/r2-after.json -w '%{http_code}' \
            -H "Authorization: Bearer $R2_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/r2/buckets/phanthuanxtra-media/objects/$R2_KEY")"
          echo "R2 read after delete HTTP $status"
          test "$status" = "404"
          echo 'QUEUE-01 PRODUCTION E2E: ADMIN 200 + SIGNED SESSION + DASHBOARD + D1 CRUD + R2 WRITE/READ/DELETE = PASS'
