name: QUEUE-01 Production E2E Origin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      BASE_URL: https://phanthuanxtra-v2.phanthuanmodelactor.workers.dev
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
      - name: Admin 200 + D1 CRUD + R2 write/read/delete
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ADMIN_PASSWORD"
          TEST_CAR_ID="ci-origin-e2e-${GITHUB_RUN_ID}"
          export TEST_CAR_ID
          status="$(curl --silent --show-error --retry 2 --max-time 20 -o /tmp/login.json -w '%{http_code}' \
            -X POST "$BASE_URL/api/admin/login" -H 'content-type: application/json' \
            --data "$(jq -nc --arg password "$ADMIN_PASSWORD" '{password:$password}')")"
          echo "Worker-origin Admin login HTTP $status"
          test "$status" = "200"
          SESSION="$(jq -r '.token // empty' /tmp/login.json)"
          test -n "$SESSION"
          echo 'Admin signed session: present'
          cleanup() {
            curl --silent --show-error --retry 2 --max-time 20 -X DELETE "$BASE_URL/api/admin/cars" \
              -H "Authorization: Bearer $SESSION" -H 'content-type: application/json' \
              --data "{\"id\":\"$TEST_CAR_ID\"}" >/dev/null || true
            if [ -n "${MEDIA_KEY:-}" ]; then
              curl --silent --show-error --retry 2 --max-time 20 -X DELETE "$BASE_URL/api/admin/media/$MEDIA_KEY" \
                -H "Authorization: Bearer $SESSION" >/dev/null || true
            fi
          }
          trap cleanup EXIT
          curl --fail-with-body --silent --show-error --retry 2 --max-time 20 \
            -X POST "$BASE_URL/api/admin/cars" -H "Authorization: Bearer $SESSION" -H 'content-type: application/json' \
            --data "{\"id\":\"$TEST_CAR_ID\",\"brand\":\"PT XTRA TEST\",\"model\":\"CI E2E Origin\",\"year\":2026,\"mileage\":1,\"price\":1,\"fuel\":\"test\",\"category\":\"suv\",\"color\":\"test\",\"status\":\"available\",\"description\":\"Queue-01 production E2E; automatically deleted.\",\"features\":[\"e2e\"],\"images\":[\"https://phanthuanxtra.com/e2e/queue-01.png\"]}" | tee /tmp/create.json
          jq -e '.ok == true and .id == env.TEST_CAR_ID' /tmp/create.json >/dev/null
          curl --fail-with-body --silent --show-error --retry 2 --max-time 20 \
            -H "Authorization: Bearer $SESSION" "$BASE_URL/api/admin/cars" | tee /tmp/cars.json
          jq -e --arg id "$TEST_CAR_ID" '.cars | any(.[]; .id == $id and .brand == "PT XTRA TEST")' /tmp/cars.json >/dev/null
          echo 'D1 CRUD: create/read/delete path ready'
          curl --fail-with-body --silent --show-error --retry 2 --max-time 20 \
            -X DELETE "$BASE_URL/api/admin/cars" -H "Authorization: Bearer $SESSION" -H 'content-type: application/json' \
            --data "{\"id\":\"$TEST_CAR_ID\"}" | tee /tmp/delete.json
          jq -e '.ok == true and .id == env.TEST_CAR_ID' /tmp/delete.json >/dev/null
          printf 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 -d > /tmp/xtra-e2e.png
          curl --fail-with-body --silent --show-error --retry 2 --max-time 20 \
            -X POST "$BASE_URL/api/admin/media" -H "Authorization: Bearer $SESSION" -H 'content-type: image/png' \
            --data-binary @/tmp/xtra-e2e.png | tee /tmp/upload.json
          MEDIA_KEY="$(jq -r '.key // empty' /tmp/upload.json)"
          export MEDIA_KEY
          test -n "$MEDIA_KEY"
          curl --fail-with-body --silent --show-error --retry 2 --max-time 20 "$BASE_URL/api/media/$MEDIA_KEY" -o /tmp/read.png
          cmp /tmp/xtra-e2e.png /tmp/read.png
          echo 'R2 write/read: OK'
          status="$(curl --silent --show-error --retry 2 --max-time 20 -o /tmp/media-delete.json -w '%{http_code}' \
            -X DELETE "$BASE_URL/api/admin/media/$MEDIA_KEY" -H "Authorization: Bearer $SESSION")"
          echo "R2 delete HTTP $status"
          test "$status" = "200"
          status="$(curl --silent --show-error --retry 2 --max-time 20 -o /tmp/media-after.json -w '%{http_code}' "$BASE_URL/api/media/$MEDIA_KEY")"
          echo "R2 read after delete HTTP $status"
          test "$status" = "404"
          echo 'QUEUE-01 PRODUCTION E2E: ADMIN 200 + SIGNED SESSION + D1 CRUD + R2 WRITE/READ/DELETE = PASS'