name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate local source
        run: npm run check

      - name: Verify no production mutation commands in CI
        run: |
          ! grep -RInE 'wrangler[[:space:]]+(deploy|d1[[:space:]]+migrations[[:space:]]+apply).*--remote|npm[[:space:]]+run[[:space:]]+(deploy|d1:migrate)' .github/workflows || exit 1
