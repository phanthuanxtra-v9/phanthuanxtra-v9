name: Codex Agent

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: 'Task instruction for Codex'
        required: true
        type: string
      mode:
        description: 'Execution mode'
        required: true
        type: choice
        options:
          - audit
          - test
          - propose-fix
      task_id:
        description: 'Gateway task ID'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  codex:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate dispatch inputs
        shell: bash
        env:
          TASK_ID: ${{ inputs.task_id }}
          INSTRUCTION: ${{ inputs.instruction }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          [[ "$TASK_ID" =~ ^[0-9a-f-]{36}$ ]]
          [[ -n "$INSTRUCTION" ]]
          [[ "$MODE" == "audit" || "$MODE" == "test" || "$MODE" == "propose-fix" ]]

      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Create isolated task branch
        shell: bash
        env:
          TASK_ID: ${{ inputs.task_id }}
        run: |
          set -euo pipefail
          git config user.name 'phanthuanxtra-codex[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "codex/${TASK_ID}"

      - name: Prepare Codex prompt
        shell: bash
        env:
          INSTRUCTION: ${{ inputs.instruction }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          cat > .codex-task-prompt.md <<'EOF'
          You are working in the repository phanthuanxtra-v9/phanthuanxtra-v9.

          Execution mode: MODE_PLACEHOLDER

          User instruction:
          EOF
          printf '%s\n' "$INSTRUCTION" >> .codex-task-prompt.md
          cat >> .codex-task-prompt.md <<'EOF'

          Safety requirements:
          - Never deploy to production.
          - Never run destructive database, DNS, R2, or Worker deletion commands.
          - Do not modify production infrastructure configuration unless explicitly required by the task.
          - Keep changes focused on the requested task.
          - In audit/test mode, do not modify tracked source files.
          - In propose-fix mode, make the smallest safe code changes needed and explain them in the final message.
          EOF
          sed -i "s/MODE_PLACEHOLDER/$MODE/" .codex-task-prompt.md

      - name: Run Codex audit/test
        if: ${{ inputs.mode != 'propose-fix' }}
        uses: openai/codex-action@v1
        with:
          prompt-file: .codex-task-prompt.md
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          output-file: codex-result.md

      - name: Run Codex propose-fix
        if: ${{ inputs.mode == 'propose-fix' }}
        uses: openai/codex-action@v1
        with:
          prompt-file: .codex-task-prompt.md
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          output-file: codex-result.md

      - name: Run repository validation
        if: ${{ inputs.mode == 'propose-fix' }}
        shell: bash
        run: |
          set -euo pipefail
          node --test developer-gateway/test/index.test.mjs
          npm run check

      - name: Detect proposed changes
        if: ${{ inputs.mode == 'propose-fix' }}
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish audit/test result
        if: ${{ inputs.mode != 'propose-fix' }}
        shell: bash
        run: |
          set -euo pipefail
          echo '## Codex result' >> "$GITHUB_STEP_SUMMARY"
          cat codex-result.md >> "$GITHUB_STEP_SUMMARY"
          rm -f .codex-task-prompt.md codex-result.md

      - name: Commit and push proposed fix
        if: ${{ inputs.mode == 'propose-fix' && steps.changes.outputs.changed == 'true' }}
        shell: bash
        env:
          TASK_ID: ${{ inputs.task_id }}
        run: |
          set -euo pipefail
          rm -f .codex-task-prompt.md codex-result.md
          git add -A
          git commit -m "feat(codex): task ${TASK_ID}"
          git push --set-upstream origin "codex/${TASK_ID}"

      - name: Create pull request
        if: ${{ inputs.mode == 'propose-fix' && steps.changes.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_ID: ${{ inputs.task_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr create \
            --base main \
            --head "codex/${TASK_ID}" \
            --title "feat(codex): task ${TASK_ID}" \
            --body "Automated Codex task dispatched by the Developer Gateway.\n\nTask ID: ${TASK_ID}\nMode: propose-fix\n\nProduction deployment and rollback remain disabled."
