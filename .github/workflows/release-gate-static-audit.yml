name: Release Gate Static Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repository and source checks
        shell: bash
        run: |
          set -euo pipefail
          test -f MASTER_PROJECT_STATUS.md
          test -f wrangler.json
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('wrangler.json','utf8'))"
          git diff --check
      - name: Release gate unit checks
        run: node --test tests/release-gate-static.test.mjs tests/admin-auth.test.mjs tests/admin-password.test.mjs tests/ai-chat-contract.test.mjs tests/production-gates.test.mjs tests/telegram-ingest.test.mjs tests/telegram-lookup.test.mjs
      - name: Node syntax audit
        shell: bash
        run: |
          set -euo pipefail
          find src developer-gateway -type f -name '*.js' -o -name '*.mjs' | sort | while read -r file; do node --check "$file"; done
      - name: APK build and reproducible artifact metadata
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          sha256sum "$apk" | tee apk-sha256.txt
          unzip -p "$apk" META-INF/MANIFEST.MF >/dev/null 2>&1 || true
      - name: Publish audit summary
        if: always()
        shell: bash
        run: |
          {
            echo '# Release Gate Static Audit'
            echo
            echo '- Static safety/unit audit: completed'
            echo '- Dual-AI production mutation path: explicitly disabled by contract checks'
            echo '- APK: fresh CI debug artifact built and SHA-256 recorded'
            echo '- Physical S21 Ultra regression: **not claimed by this CI job**'
            echo '- Production password-reset E2E: **requires explicit production run**'
            echo '- Telegram/VIP live-message E2E: **requires configured production bot/chat evidence**'
            echo '- Backup/restore: **requires a successful backup run**'
          } >> "$GITHUB_STEP_SUMMARY"
