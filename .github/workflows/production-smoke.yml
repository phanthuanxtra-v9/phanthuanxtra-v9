name: Production Smoke Test

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: https://phanthuanxtra.com
      WORKER_URL: https://phanthuanxtra-v2.phanthuanmodelactor.workers.dev
      GATEWAY_URL: https://phanthuanxtra-developer-gateway.phanthuanmodelactor.workers.dev
      GATEWAY_READ_TOKEN: ${{ secrets.GATEWAY_READ_TOKEN }}
    steps:
      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Smoke website and production Worker
        shell: bash
        run: |
          set -euo pipefail
          check_http_200() {
            local url="$1" label="$2" body status
            body="$(mktemp)"
            status="$(curl --silent --show-error --retry 3 --retry-delay 1 --max-time 20 -o "$body" -w '%{http_code}' "$url")"
            echo "$label HTTP $status"
            test "$status" = "200"
            head -c 500 "$body"; echo
          }
          check_http_200 "$SITE_URL/" "Website"
          check_http_200 "$SITE_URL/api/health" "/api/health"
          check_http_200 "$SITE_URL/api/cars" "/api/cars"
          check_http_200 "$SITE_URL/admin.html" "/admin.html"
          check_http_200 "$WORKER_URL/" "Production Worker"

      - name: Smoke admin authentication boundary
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --retry 2 --retry-delay 1 --max-time 20 -o /tmp/admin.json -w '%{http_code}' \
            -X POST "$SITE_URL/api/admin/login" \
            -H 'content-type: application/json' \
            --data '{"password":"__invalid_smoke_password__"}')"
          echo "Admin login invalid-credential boundary HTTP $status"
          test "$status" = "401"

          status="$(curl --silent --show-error --retry 2 --retry-delay 1 --max-time 20 -o /tmp/dashboard.json -w '%{http_code}' \
            "$SITE_URL/api/admin/dashboard")"
          echo "Admin dashboard unauthenticated boundary HTTP $status"
          test "$status" = "401"

      - name: Smoke Developer Gateway public health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 1 --max-time 20 \
            "$GATEWAY_URL/health" | tee /tmp/gateway-health.json
          jq -e '.ok == true and .service == "developer-gateway" and .unified_ai == true and .unified_ai_engine == "cloudflare-workers-ai"' /tmp/gateway-health.json >/dev/null

      - name: Smoke Developer Gateway authentication boundary
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --retry 2 --retry-delay 1 --max-time 20 -o /tmp/gateway-unauth.json -w '%{http_code}' \
            -X POST "$GATEWAY_URL/v1/ai/unified" \
            -H 'content-type: application/json' \
            --data '{"instruction":"smoke unauthorized test"}')"
          echo "Gateway unauthenticated boundary HTTP $status"
          test "$status" = "401"
          jq -e '.ok == false and .error == "unauthorized"' /tmp/gateway-unauth.json >/dev/null

      - name: Smoke XTRA Unified AI with configured gateway credential
        if: ${{ env.GATEWAY_READ_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 1 --max-time 60 \
            -X POST "$GATEWAY_URL/v1/ai/unified" \
            -H "Authorization: Bearer $GATEWAY_READ_TOKEN" \
            -H 'content-type: application/json' \
            --data '{"task_id":"production-smoke","mode":"audit","instruction":"Return exactly: XTRA_UNIFIED_AI_OK"}' \
            | tee /tmp/unified-ai.json
          jq -e '.ok == true and .logical_agent == "xtra-unified-ai" and .engine == "cloudflare-workers-ai" and .production_mutation == false' /tmp/unified-ai.json >/dev/null
          jq -e '.response | contains("XTRA_UNIFIED_AI_OK")' /tmp/unified-ai.json >/dev/null

      - name: Record Unified AI credential blocker
        if: ${{ env.GATEWAY_READ_TOKEN == '' }}
        run: |
          echo 'WARNING: GATEWAY_READ_TOKEN is not available in GitHub Actions, so authenticated /v1/ai/unified execution was not attempted.'
          echo 'Gateway public health and authentication boundary remain verified.'

      - name: Smoke summary
        run: |
          echo 'Production smoke coverage passed for site, Worker, Admin boundaries and Developer Gateway health.'
          if [ -n "${GATEWAY_READ_TOKEN:-}" ]; then
            echo 'Authenticated XTRA Unified AI smoke: executed.'
          else
            echo 'Authenticated XTRA Unified AI smoke: BLOCKED by missing GitHub GATEWAY_READ_TOKEN secret.'
          fi

# Verification trigger: run after gateway credential rotation; never contains secret material.
