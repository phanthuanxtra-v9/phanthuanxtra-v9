name: AI Peer Continuity

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: 'Task to continue from the GitHub checkpoint'
        required: true
        type: string
      task_id:
        description: 'Stable task/checkpoint ID'
        required: true
        type: string
      agent:
        description: 'Peer routing'
        required: true
        type: choice
        options:
          - all
          - mistral
          - gemma
          - llama
        default: all

permissions:
  contents: read
  pull-requests: read

jobs:
  peer-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout project checkpoint
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Run peer AI review
        shell: bash
        env:
          TASK_ID: ${{ inputs.task_id }}
          MULTI_AI_INSTRUCTION: ${{ inputs.instruction }}
          AI_PEER_AGENT: ${{ inputs.agent }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMMA_MODEL: ${{ vars.GEMMA_MODEL }}
          LLAMA_API_KEY: ${{ secrets.LLAMA_API_KEY }}
          LLAMA_BASE_URL: ${{ vars.LLAMA_BASE_URL }}
          LLAMA_MODEL: ${{ vars.LLAMA_MODEL }}
        run: |
          set -euo pipefail
          printf '%s\n' "$MULTI_AI_INSTRUCTION" > peer-task.txt
          node developer-gateway/multi-ai-review.mjs | tee ai-peer-review.json
          {
            echo '# AI Peer Continuity'
            echo
            echo "task_id=${TASK_ID}"
            echo "requested_agent=${AI_PEER_AGENT}"
            echo '- Production mutations: **not attempted**'
            echo '- Direct Cloudflare credentials exposed: **no**'
            echo
            cat ai-peer-review.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload peer result
        uses: actions/upload-artifact@v4
        with:
          name: phanthuanxtra-ai-peer-${{ inputs.task_id }}
          path: ai-peer-review.json
          if-no-files-found: error
          retention-days: 7
