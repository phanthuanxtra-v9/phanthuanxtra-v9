name: AI Peer Continuity

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: 'Task to continue from the GitHub checkpoint'
        required: true
        type: string
      task_id:
        description: 'Stable task/checkpoint ID'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  unified-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout project checkpoint
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Run XTRA Unified AI
        shell: bash
        env:
          TASK_ID: ${{ inputs.task_id }}
          MULTI_AI_INSTRUCTION: ${{ inputs.instruction }}
          GATEWAY_READ_TOKEN: ${{ secrets.GATEWAY_READ_TOKEN }}
          UNIFIED_AI_GATEWAY_URL: https://phanthuanxtra-developer-gateway.phanthuanmodelactor.workers.dev
        run: |
          set -euo pipefail
          printf '%s\n' "$MULTI_AI_INSTRUCTION" > unified-ai-task.txt
          node developer-gateway/multi-ai-review.mjs | tee unified-ai-review.json
          {
            echo '# XTRA Unified AI'
            echo
            echo "task_id=${TASK_ID}"
            echo '- Logical agents: **1**'
            echo '- Inference engine: **Cloudflare Workers AI**'
            echo '- Independent peer API calls: **0**'
            echo '- Production mutations: **not attempted**'
            echo '- Direct Cloudflare credentials exposed: **no**'
            echo
            cat unified-ai-review.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unified result
        uses: actions/upload-artifact@v4
        with:
          name: phanthuanxtra-unified-ai-${{ inputs.task_id }}
          path: unified-ai-review.json
          if-no-files-found: error
          retention-days: 7
