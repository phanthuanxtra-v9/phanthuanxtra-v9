name: Deploy Cloudflare Worker

# Production verification remains GitHub Actions based;
# do not run Wrangler on Android/Termux.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "AUDIT_*.md"
      - "backup/README.md"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: false

env:
  # Keep Cloudflare credentials scoped to the resolver steps. The resolver
  # exports them to the current process and persists them for later steps.

jobs:
  validate:
    name: CI / Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript syntax and tests
        run: |
          node --check src/entry.js
          node --check src/cms.js
          node --check src/index.js
          node --check src/app-api.js
          node --check src/app-admin.js
          node --check src/telegram.js
          node --check src/telegram-ingest.js
          node --check src/telegram-router.js
          node --check src/vip-telegram.js
          node --check src/vip-vehicle-intelligence.js
          node --check src/vehicle-ai.js
          node --check src/media.js
          node --check src/ai-chat.js
          node --check src/plate-branding.js
          node --check public/script.js

          node --test \
            tests/telegram.test.mjs \
            tests/ai-chat.test.mjs \
            tests/pt-xtra-media.test.mjs \
            tests/pt-xtra-plate.test.mjs \
            tests/plate-branding.test.mjs \
            tests/production-gates.test.mjs \
            tests/vip-vehicle-intelligence.test.mjs

      - name: Resolve Cloudflare credentials
        shell: bash
        env:
          CF_PRIMARY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_BACKUP_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_API_TOKEN }}
          CF_CONFIGURED_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token="${CF_PRIMARY_TOKEN:-}"
          if [ -z "$token" ]; then
            token="${CF_BACKUP_TOKEN:-}"
          fi
          if [ -z "$token" ]; then
            echo "Cloudflare API token is unavailable to this workflow run."
            exit 1
          fi
          export CLOUDFLARE_API_TOKEN="$token"
          printf '%s\n' "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"

          account_id="${CF_CONFIGURED_ACCOUNT_ID:-}"
          if ! printf '%s' "$account_id" | grep -Eq '^[0-9a-fA-F]{32}$'; then
            echo "CLOUDFLARE_ACCOUNT_ID secret unavailable; resolving account from authenticated Wrangler identity."
            whoami_output="$(npx wrangler@4.129.0 whoami --json 2>&1)"
            account_id="$(printf '%s' "$whoami_output" | jq -r '.accounts[0].id // empty')"
          fi
          if ! printf '%s' "$account_id" | grep -Eq '^[0-9a-fA-F]{32}$'; then
            echo "A valid Cloudflare account ID could not be resolved from the authenticated Wrangler identity."
            exit 1
          fi
          printf '%s\n' "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          echo "Cloudflare credentials resolved without exposing secret values."

      - name: Wrangler dry-run validation
        run: npx wrangler@4.129.0 deploy --dry-run

  deploy:
    name: Deploy production Worker (Production)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Cloudflare credentials
        shell: bash
        env:
          CF_PRIMARY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_BACKUP_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_API_TOKEN }}
          CF_CONFIGURED_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token="${CF_PRIMARY_TOKEN:-}"
          if [ -z "$token" ]; then
            token="${CF_BACKUP_TOKEN:-}"
          fi
          if [ -z "$token" ]; then
            echo "Cloudflare API token is unavailable to this workflow run."
            exit 1
          fi
          export CLOUDFLARE_API_TOKEN="$token"
          printf '%s\n' "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"

          account_id="${CF_CONFIGURED_ACCOUNT_ID:-}"
          if ! printf '%s' "$account_id" | grep -Eq '^[0-9a-fA-F]{32}$'; then
            echo "CLOUDFLARE_ACCOUNT_ID secret unavailable; resolving account from authenticated Wrangler identity."
            whoami_output="$(npx wrangler@4.129.0 whoami --json 2>&1)"
            account_id="$(printf '%s' "$whoami_output" | jq -r '.accounts[0].id // empty')"
          fi
          if ! printf '%s' "$account_id" | grep -Eq '^[0-9a-fA-F]{32}$'; then
            echo "A valid Cloudflare account ID could not be resolved from the authenticated Wrangler identity."
            exit 1
          fi
          printf '%s\n' "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          echo "Cloudflare credentials resolved without exposing secret values."

      - name: Verify Wrangler
        run: npx wrangler@4.129.0 --version

      - name: Wrangler dry-run
        run: npx wrangler@4.129.0 deploy --dry-run

      - name: Detect D1 migration changes
        id: migrations
        shell: bash
        run: |
          set -euo pipefail

          if git diff --name-only HEAD^ HEAD | grep -q '^migrations/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "D1 migrations changed in this commit; remote migration step required."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No D1 migration changes in this commit; skipping remote migration step."
          fi

      - name: Apply D1 migrations
        if: steps.migrations.outputs.changed == 'true'
        run: npx wrangler@4.129.0 d1 migrations apply phanthuanxtra-db --remote

      - name: Deploy to Cloudflare
        run: npx wrangler@4.129.0 deploy

      - name: Deployment completed
        run: |
          echo "========================================"
          echo "Cloudflare deployment completed"
          echo "========================================"
