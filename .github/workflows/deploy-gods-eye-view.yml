name: Validate God's Eye View

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/gods-eye-view/**"
      - ".github/workflows/deploy-gods-eye-view.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  GEV_UPSTREAM_REPOSITORY: https://github.com/bilawalsidhu/gods-eye-view.git
  GEV_UPSTREAM_COMMIT: 65bc522f49dc1166eca533996be8e789ad36cfe5

concurrency:
  group: gods-eye-view-validation
  cancel-in-progress: false

jobs:
  build-and-validate:
    name: Build and validate God's Eye View
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PHAN THUẦN XTRA
        uses: actions/checkout@v5

      - name: Verify isolated route configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"pattern": "eye.phanthuanxtra.com"' apps/gods-eye-view/wrangler.jsonc
          grep -Fq '"custom_domain": true' apps/gods-eye-view/wrangler.jsonc
          echo "Verified isolated route: eye.phanthuanxtra.com"
          echo "Production deployment is intentionally not performed by this validation workflow."

      - name: Fetch pinned upstream release
        working-directory: apps/gods-eye-view
        run: |
          set -euo pipefail
          rm -rf upstream
          git clone --depth 1 "$GEV_UPSTREAM_REPOSITORY" upstream
          cd upstream
          git fetch --depth 1 origin "$GEV_UPSTREAM_COMMIT"
          git checkout --detach "$GEV_UPSTREAM_COMMIT"
          test "$(git rev-parse HEAD)" = "$GEV_UPSTREAM_COMMIT"
          echo "Pinned upstream: $(git rev-parse HEAD)"

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/gods-eye-view/upstream/package-lock.json

      - name: Install upstream dependencies
        working-directory: apps/gods-eye-view/upstream
        run: npm ci

      - name: Build upstream application
        working-directory: apps/gods-eye-view/upstream
        run: npm run build

      - name: Verify build output
        working-directory: apps/gods-eye-view/upstream
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -s dist/index.html
          echo "Build output verified: $(du -sh dist | cut -f1)"

      - name: Wrangler dry-run validation
        run: npx wrangler@4.129.0 deploy --config apps/gods-eye-view/wrangler.jsonc --dry-run
