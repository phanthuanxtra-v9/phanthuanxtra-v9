name: Application Validation

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'migrations/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.json'
      - '.github/workflows/application-validation.yml'
      - '.github/workflows/deploy-cloudflare.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { fetch-depth: 0 }
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 24, cache: npm }
      - name: Validate JavaScript syntax
        run: |
          node --check src/entry.js
          node --check src/cms.js
          node --check src/index.js
          node --check src/app-api.js
          node --check src/ai-chat.js
          node --check src/telegram-lookup.js
          node --check src/vip-telegram.js
          node --check src/vip-vehicle-intelligence.js
      - name: Guard Workers AI model IDs
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n --exclude-dir=node_modules --exclude-dir=.git \
            -E '@cf/meta/llama-3\.1-8b-instruct(["@]|[^a-zA-Z0-9_-])' src tests; then
            echo "ERROR: deprecated Workers AI model ID detected"; exit 1
          fi
          grep -n '@cf/meta/llama-3.2-3b-instruct' src/ai-chat.js
          echo "Workers AI model guard passed"
      - name: Unit tests
        run: |
          node --test tests/*.test.mjs
          node --test developer-gateway/test/index.test.mjs
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Wrangler dry-run
        run: npx --yes wrangler deploy --dry-run
      - name: Verify no runtime DDL
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          changed_files="$(git diff --name-only "$base_sha" "$head_sha" -- 'src/**' 'public/**' 'developer-gateway/**')"
          if [ -z "$changed_files" ]; then echo "NO RUNTIME FILES CHANGED"; exit 0; fi
          printf '%s\n' "$changed_files"
          if git diff --unified=0 "$base_sha" "$head_sha" -- $changed_files | grep -E '^\+.*(CREATE TABLE|CREATE INDEX|ALTER TABLE|DROP TABLE|DROP INDEX)'; then
            echo "ERROR: runtime DDL added by this pull request"; exit 1
          fi
          echo "NO RUNTIME DDL ADDED BY THIS PULL REQUEST"
