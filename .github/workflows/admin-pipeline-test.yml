name: Admin PT Xtra Pipeline

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --check src/admin-auth.js
      - run: node --check src/admin-password.js
      - run: node --check src/admin-vehicle-pipeline.js
      - run: node --check src/app-admin.js
      - run: node --check src/entry.js
      - run: node --test tests/admin-auth.test.mjs tests/admin-password.test.mjs tests/admin-vehicle-pipeline.test.mjs tests/app-admin-contract.test.mjs
