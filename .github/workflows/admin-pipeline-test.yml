name: Admin PT Xtra Pipeline

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --check src/admin-vehicle-pipeline.js
      - run: node --check src/entry.js
      - run: node --test tests/admin-vehicle-pipeline.test.mjs
