name: Android APK MVP
on:
  push:
    branches: [main, feature/apk-mvp, refactor/apk-architecture-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Production App API smoke test
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 --max-time 20 https://phanthuanxtra.com/api/app/v1/health)"
          echo "$response"
          echo "$response" | jq -e '.ok == true and .service == "app-api"' >/dev/null
          echo "Production App API health: PASS"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: phanthuanxtra-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
