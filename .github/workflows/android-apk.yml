name: Android APK MVP
on:
  push:
    branches: [main, feature/apk-mvp, refactor/apk-architecture-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Production App API smoke test
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 --max-time 20 https://phanthuanxtra.com/api/app/v1/health)"
          echo "$response"
          echo "$response" | jq -e '.ok == true and .service == "app-api"' >/dev/null
          echo "Production App API health: PASS"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: AI contract regression tests
        working-directory: .
        shell: bash
        run: node --test tests/ai-chat-contract.test.mjs
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phanthuanxtra-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
